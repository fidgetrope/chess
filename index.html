<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D Chess</title>
  </head>
  <body>
    <div id="app">
      <div id="scene-container"></div>

      <div id="ui">
        <div id="hud">
          <div id="hud-left">
            <div id="turn-indicator">Your turn</div>
            <div id="check-banner" class="hidden">Check</div>
            <div id="captured-tray" hidden>
              <span class="cap-side"><span class="cap-tag">You</span><span id="captured-by-you" class="captured-pieces"></span></span>
              <span class="cap-side"><span class="cap-tag">AI</span><span id="captured-by-ai" class="captured-pieces"></span></span>
            </div>
          </div>
          <div id="hud-actions">
            <button id="undo" type="button">Undo</button>
            <button id="moves-toggle" type="button" aria-expanded="false">Moves</button>
            <button id="coach-toggle" type="button" aria-expanded="false">Coach</button>
            <button id="view-toggle" type="button" title="Switch between the 3D and flat board">2D</button>
            <button id="menu-toggle" type="button" aria-expanded="false" aria-label="Settings">&#9881;</button>
          </div>
        </div>

        <div id="menu-panel" hidden>
          <label for="difficulty">Difficulty</label>
          <select id="difficulty">
            <option value="easy" selected>Easy</option>
            <option value="medium">Medium</option>
            <option value="hard">Hard</option>
          </select>
          <button id="restart" type="button">Restart</button>
        </div>

        <div id="moves-panel" hidden>
          <ol id="move-list"></ol>
        </div>

        <div id="coach-panel" hidden>
          <div id="coach-advice">
            <p id="coach-standing" hidden></p>
            <p id="coach-threat">Thinking…</p>
            <button id="coach-hint-btn" type="button">Show a hint</button>
            <p id="coach-hint" hidden><strong id="coach-hint-move"></strong> <span id="coach-hint-reason"></span></p>
          </div>
          <div id="coach-settings">
            <label><input type="checkbox" id="coach-enabled" /> Coach on</label>
            <label><input type="checkbox" id="coach-blunder" /> Warn me before a blunder</label>
          </div>
        </div>

        <div id="promotion-picker" class="hidden">
          <div id="promotion-panel">
            <p>Promote to</p>
            <div id="promotion-choices">
              <button type="button" data-piece="q">Queen</button>
              <button type="button" data-piece="r">Rook</button>
              <button type="button" data-piece="b">Bishop</button>
              <button type="button" data-piece="n">Knight</button>
            </div>
          </div>
        </div>

        <div id="game-over" class="hidden">
          <div id="game-over-panel">
            <p id="game-over-message"></p>
            <button id="play-again" type="button">Play Again</button>
          </div>
        </div>

        <div id="blunder-dialog" class="hidden">
          <div id="blunder-panel">
            <p id="blunder-message"></p>
            <div id="blunder-actions">
              <button id="blunder-back" type="button">Take it back</button>
              <button id="blunder-play" type="button">Play it anyway</button>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
